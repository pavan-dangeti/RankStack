name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --all-groups --locked
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: mypy strict
        run: uv run mypy

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --all-groups --locked
      - name: Unit and property tests
        run: uv run pytest tests/unit tests/property -q
      - name: Coverage gate across the whole suite
        # The gate is measured over every suite: build, download and leakage code is only reachable
        # through the integration and end-to-end tests, so a unit-only gate would be meaningless.
        run: |
          uv run pytest \
            --cov=rankstack --cov-branch --cov-report=xml --cov-report=term \
            --cov-fail-under=85

  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --all-groups --locked
      - name: Pipeline against real DuckDB and the publisher file formats
        run: uv run pytest tests/integration

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --all-groups --locked
      - name: Whole pipeline, including the leakage negative control
        run: uv run pytest tests/e2e

  security:
    name: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --all-groups --locked
      - name: Dependency audit
        run: uv export --all-groups --frozen --no-emit-project | uvx pip-audit --strict --progress-spinner off
      - name: Dataset files are never committed
        run: uv run python scripts/check_no_dataset_files.py
      - name: Build the pipeline image for scanning
        run: docker build -f infra/docker/Dockerfile.pipeline -t rankstack-pipeline:ci .
      - name: Container scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rankstack-pipeline:ci
          scan-type: image
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2

  docs-drift:
    name: docs-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --all-groups --locked
      - name: Every published figure must match a committed result file
        run: uv run python scripts/check_docs_drift.py

  images:
    name: build-images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the pipeline image
        run: docker build -f infra/docker/Dockerfile.pipeline -t rankstack-pipeline:ci .
      - name: Image runs the pipeline entry point
        run: |
          docker run --rm rankstack-pipeline:ci scripts/build_dataset.py --help